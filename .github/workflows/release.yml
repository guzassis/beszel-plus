name: Make release and binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-save --cwd ./internal/site

      - name: Build site
        run: bun run --cwd ./internal/site build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          check-latest: true

      - name: GoReleaser beszel
        uses: goreleaser/goreleaser-action@v7
        with:
          workdir: ./
          distribution: goreleaser
          version: v2.17.0
          args: ${{ startsWith(github.ref, 'refs/tags/') && 'release --clean' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify paired Agent and maintenance helper assets
        run: |
          set -eu
          assets=$(find dist -maxdepth 1 -type f -printf '%f\n')
          case "$GITHUB_REF" in
            refs/tags/*) checksum="beszel_${GITHUB_REF_NAME#v}_checksums.txt" ;;
            *)
              checksum=$(printf '%s\n' "$assets" | grep -E '^beszel_.+_checksums\.txt$')
              [ "$(printf '%s\n' "$checksum" | wc -l)" -eq 1 ] || {
                echo "Expected exactly one snapshot checksum manifest." >&2
                exit 1
              }
              ;;
          esac
          printf '%s\n' "$assets" | grep -qx "$checksum"
          for required in \
            beszel_linux_amd64.tar.gz \
            beszel_linux_arm64.tar.gz \
            beszel-agent_linux_amd64.tar.gz \
            beszel-agent_linux_arm64.tar.gz \
            beszel-maintenance-helper_linux_amd64.tar.gz \
            beszel-maintenance-helper_linux_arm64.tar.gz
          do
            printf '%s\n' "$assets" | grep -qx "$required" || {
              echo "Missing required release asset: $required" >&2
              exit 1
            }
          done
          printf '%s\n' "$assets" | while IFS= read -r asset; do
            case "$asset" in
              beszel-agent_linux_*.tar.gz)
                suffix=${asset#beszel-agent_}
                helper="beszel-maintenance-helper_${suffix}"
                printf '%s\n' "$assets" | grep -qx "$helper" || {
                  echo "Missing paired helper asset: $helper" >&2
                  exit 1
                }
                ;;
            esac
          done
