name: Make release and binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-save --cwd ./internal/site

      - name: Build site
        run: bun run --cwd ./internal/site build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          check-latest: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build .NET LHM executable for Windows sensors
        run: |
          dotnet build -c Release ./agent/lhm/beszel_lhm.csproj
        shell: bash

      - name: GoReleaser beszel
        uses: goreleaser/goreleaser-action@v6
        with:
          workdir: ./
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          IS_FORK: ${{ github.repository_owner != 'henrygd' }}

      - name: Verify paired Agent and maintenance helper assets
        run: |
          set -eu
          assets=$(find dist -maxdepth 1 -type f -printf '%f\n')
          checksum="beszel_${GITHUB_REF_NAME#v}_checksums.txt"
          printf '%s\n' "$assets" | grep -qx "$checksum"
          printf '%s\n' "$assets" | while IFS= read -r asset; do
            case "$asset" in
              beszel-agent_linux_*_glibc.tar.gz) continue ;;
              beszel-agent_linux_*.tar.gz)
                suffix=${asset#beszel-agent_}
                helper="beszel-maintenance-helper_${suffix}"
                printf '%s\n' "$assets" | grep -qx "$helper" || {
                  echo "Missing paired helper asset: $helper" >&2
                  exit 1
                }
                ;;
            esac
          done
