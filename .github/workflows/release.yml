name: Validate and release binaries

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.identity.outputs.package_version }}
      artifact_version: ${{ steps.identity.outputs.artifact_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --no-save --cwd ./internal/site

      - name: Check update translations
        run: bun run --cwd ./internal/site check:update-i18n

      - name: Build site
        run: bun run --cwd ./internal/site build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.8
          check-latest: true

      - name: Install distribution APT bindings for inventory regression
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-apt

      - name: Test Go packages
        env:
          BESZEL_TEST_APT: "1"
        run: go test -tags=testing ./...

      - name: Verify APT privilege drop in hardened helper
        env:
          BESZEL_TEST_SYSTEMD: "1"
        run: go test -tags=testing -run '^TestSystemdMaintenanceSandboxAllowsAPTPrivilegeDrop$' -count=1 -v ./internal/maintenance

      - name: Determine and validate release identity
        id: identity
        shell: bash
        run: |
          set -eu
          package_version=$(node -p "require('./internal/site/package.json').version")
          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected a stable package version, got $package_version" >&2
            exit 1
          }
          case "$GITHUB_REF" in
            refs/tags/v*)
              tag_version=${GITHUB_REF_NAME#v}
              [ "$tag_version" = "$package_version" ] || {
                echo "Release tag v$tag_version does not match package version $package_version" >&2
                exit 1
              }
              artifact_version=$tag_version
              ;;
            *)
              artifact_version="${package_version}-snapshot.${GITHUB_SHA}"
              ;;
          esac
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"
          echo "BESZEL_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Build and package native assets
        uses: goreleaser/goreleaser-action@v7
        with:
          workdir: ./
          distribution: goreleaser
          version: v2.17.0
          args: ${{ startsWith(github.ref, 'refs/tags/') && 'release --clean --skip=publish' || 'release --snapshot --clean' }}

      - name: Verify checksums and component metadata
        run: go run ./scripts/verify-release-assets dist "${{ steps.identity.outputs.artifact_version }}" "$GITHUB_SHA"

      - name: Upload verified snapshot and release assets
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: beszel-plus-${{ steps.identity.outputs.artifact_version }}
          path: |
            dist/beszel_linux_amd64.tar.gz
            dist/beszel_linux_arm64.tar.gz
            dist/beszel-agent_linux_amd64.tar.gz
            dist/beszel-agent_linux_arm64.tar.gz
            dist/beszel-maintenance-helper_linux_amd64.tar.gz
            dist/beszel-maintenance-helper_linux_arm64.tar.gz
            dist/beszel_${{ steps.identity.outputs.artifact_version }}_checksums.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release-publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download validated assets
        uses: actions/download-artifact@v7
        with:
          name: beszel-plus-${{ needs.validate.outputs.artifact_version }}
          path: dist

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.8
          check-latest: true

      - name: Recheck validated assets
        run: go run ./scripts/verify-release-assets dist "${{ needs.validate.outputs.artifact_version }}" "$GITHUB_SHA"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        shell: bash
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            dist/beszel_linux_amd64.tar.gz \
            dist/beszel_linux_arm64.tar.gz \
            dist/beszel-agent_linux_amd64.tar.gz \
            dist/beszel-agent_linux_arm64.tar.gz \
            dist/beszel-maintenance-helper_linux_amd64.tar.gz \
            dist/beszel-maintenance-helper_linux_arm64.tar.gz \
            "dist/beszel_${PACKAGE_VERSION}_checksums.txt" \
            --verify-tag \
            --title "Beszel Plus v${PACKAGE_VERSION}" \
            --notes "Beszel Plus v${PACKAGE_VERSION}. Native assets and checksums were verified before publishing."
