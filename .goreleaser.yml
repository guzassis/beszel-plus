version: 2
project_name: beszel

before:
  hooks:
    - go mod tidy
    - go generate -run fetchsmartctl ./agent

builds:
  - id: beszel
    binary: beszel
    main: internal/cmd/hub/hub.go
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: &build_ldflags
      - >-
        -s -w
        -X github.com/henrygd/beszel/internal/buildinfo.Version={{.Version}}
        -X github.com/henrygd/beszel/internal/buildinfo.GitCommit={{.Commit}}
        -X github.com/henrygd/beszel/internal/buildinfo.BuildDate={{.Date}}
        -X 'github.com/henrygd/beszel/internal/buildinfo.ProductName=Beszel Plus'
        -X 'github.com/henrygd/beszel/internal/buildinfo.ProductShortName=Beszel Plus'
        -X github.com/henrygd/beszel/internal/buildinfo.ProductSlug=beszel-plus
        -X github.com/henrygd/beszel/internal/buildinfo.RepositoryOwner=guzassis
        -X github.com/henrygd/beszel/internal/buildinfo.RepositoryName=beszel-plus
        -X github.com/henrygd/beszel/internal/buildinfo.RepositoryURL=https://github.com/guzassis/beszel-plus
        -X github.com/henrygd/beszel/internal/buildinfo.DocumentationURL=https://github.com/guzassis/beszel-plus#readme

  - id: beszel-agent
    binary: beszel-agent
    main: internal/cmd/agent/agent.go
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *build_ldflags

  - id: beszel-maintenance-helper
    binary: beszel-maintenance-helper
    main: internal/cmd/maintenance-helper/main.go
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *build_ldflags

archives:
  - id: beszel
    ids: [beszel]
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
  - id: beszel-agent
    ids: [beszel-agent]
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
  - id: beszel-maintenance-helper
    ids: [beszel-maintenance-helper]
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "beszel_{{ .Version }}_checksums.txt"

release:
  draft: false

changelog:
  disable: true
